<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum — Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="index.html">Lakou Kizin</a>
  <span style="opacity:.6;">/</span>
  <span>Forum</span>
</div>

<div class="forum-intro">
  <h1>Forum</h1>
</div>

<p id="forum-guard-msg" class="pub-grid-empty">Vérification des accès…</p>

<div id="forum-content" class="hidden">

  <div class="forum-toolbar">
    <div class="forum-categories" id="forum-categories">
      <button class="forum-cat-pill active" data-cat="" onclick="setForumCategory('', this)">Tout</button>
      <button class="forum-cat-pill" data-cat="questions" onclick="setForumCategory('questions', this)">Questions</button>
      <button class="forum-cat-pill" data-cat="projets" onclick="setForumCategory('projets', this)">Projets</button>
      <button class="forum-cat-pill" data-cat="ressources" onclick="setForumCategory('ressources', this)">Ressources</button>
      <button class="forum-cat-pill" data-cat="entraide" onclick="setForumCategory('entraide', this)">Entraide</button>
      <button class="forum-cat-pill" data-cat="annonces" onclick="setForumCategory('annonces', this)">Annonces</button>
    </div>
    <button class="btn-principal" onclick="ouvrirNouveauSujet()">+ Nouveau sujet</button>
  </div>

  <div id="forum-topics-list" class="forum-topics-list">
    <p class="pub-grid-empty">Chargement…</p>
  </div>

</div>

<footer>Lakou Kizin — École de cuisine, réseau Lakou Inivesite</footer>

<!-- Modal nouveau sujet -->
<div class="forum-modal-overlay" id="forum-modal-overlay">
  <div class="forum-modal-card">
    <button class="forum-modal-close" id="forum-modal-close" type="button">&times;</button>
    <h2>Nouveau sujet</h2>
    <p id="forum-modal-msg" class="cal-modal-msg" style="margin-bottom:8px;"></p>

    <div class="champ">
      <label>Titre</label>
      <input type="text" id="forum-new-title" placeholder="Titre du sujet">
    </div>

    <div class="champ">
      <label>Catégorie</label>
      <select id="forum-new-category">
        <option value="questions">Questions</option>
        <option value="projets">Projets</option>
        <option value="ressources">Ressources</option>
        <option value="entraide">Entraide</option>
        <option value="annonces">Annonces</option>
      </select>
    </div>

    <div class="champ">
      <label>Message</label>
      <textarea id="forum-new-content" rows="5" placeholder="Décris ta question ou ton sujet en détail…"></textarea>
    </div>

    <button class="btn-principal" id="forum-new-submit" style="width:100%;" onclick="doCreateTopic()">Publier</button>
  </div>
</div>

<div id="toast"></div>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="forum.js"></script>
</body>
</html>
