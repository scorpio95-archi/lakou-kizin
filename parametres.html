<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-wrap{ max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  .form-wrap h1{ font-size:1.5rem; margin-bottom:4px; }
  .form-wrap .sub{ color:#6b5d4e; font-size:0.9rem; margin-bottom:22px; }

  .avatar-zone{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .avatar-preview{
    width:76px; height:76px; border-radius:50%; overflow:hidden; background:var(--basilic-clair);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1.6rem;
    flex-shrink:0; border:2px solid var(--bordeaux);
  }
  .avatar-preview img{ width:100%; height:100%; object-fit:cover; }
  .btn-avatar{
    padding:9px 14px; border-radius:20px; border:1.5px solid var(--bordeaux); background:none;
    color:var(--bordeaux); font-weight:700; font-size:0.85rem; cursor:pointer;
  }
  input[type="file"]{ display:none; }

  .champ{ margin-bottom:16px; }
  .champ label{ display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; color:var(--charbon); }
  .champ input, .champ select, .champ textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(42,23,19,0.15);
    background:var(--creme-carte); font-size:1rem; font-family:'Karla', sans-serif; color:var(--charbon);
  }
  .champ textarea{ min-height:80px; resize:vertical; }
  .champ input:focus, .champ select:focus, .champ textarea:focus{ outline:none; border-color:var(--bordeaux); }

  .section-titre{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:var(--paprika-fonce);
    margin:30px 0 14px; padding-top:20px; border-top:1px solid rgba(42,23,19,0.1);
  }

  .btn-principal{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--bordeaux); color:#fff8ec; font-weight:700; font-size:1rem;
    font-family:'Karla', sans-serif; cursor:pointer;
  }
  .btn-principal:disabled{ opacity:0.6; }
  .btn-secondaire{
    width:100%; padding:12px; border-radius:12px; margin-top:10px;
    background:none; border:1.5px solid rgba(42,23,19,0.2); color:var(--charbon);
    font-weight:700; font-size:0.92rem; font-family:'Karla', sans-serif; cursor:pointer;
  }
  .message{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:0.88rem; display:none; }
  .message.erreur{ background:#fbe3df; color:#8a2c1c; display:block; }
  .message.succes{ background:#e2ede1; color:#2c4a2e; display:block; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="index.html">Lakou Kizin</a>
  <span style="opacity:.6;">/</span>
  <span>Paramètres</span>
</div>

<main class="form-wrap">
  <div id="blocConnexionRequise" style="display:none;" class="connexion-requise">
    Tu dois <a href="connexion.html">te connecter</a> pour accéder à tes paramètres.
  </div>

  <div id="contenuParametres" style="display:none;">
    <h1>Ton profil</h1>
    <p class="sub">Visible par toute la communauté Lakou Kizin.</p>

    <div class="avatar-zone">
      <div class="avatar-preview" id="avatarPreview"></div>
      <div>
        <button type="button" class="btn-avatar" id="btnChangerAvatar">Changer la photo</button>
        <input type="file" id="avatarInput" accept="image/*">
      </div>
    </div>

    <form id="formProfil">
      <div class="champ">
        <label for="fullName">Nom complet</label>
        <input type="text" id="fullName" required maxlength="80">
      </div>
      <div class="champ">
        <label for="role">Rôle</label>
        <select id="role">
          <option value="etudiant">Étudiant</option>
          <option value="enseignant">Enseignant</option>
          <option value="visiteur">Visiteur</option>
          <option value="admin" disabled>Admin</option>
        </select>
      </div>
      <div class="champ">
        <label for="atelierPrincipal">Atelier principal</label>
        <input type="text" id="atelierPrincipal" placeholder="Ex : Pâtisserie">
      </div>
      <div class="champ">
        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="300" placeholder="Quelques mots sur toi et ta cuisine…"></textarea>
      </div>
      <button class="btn-principal" type="submit" id="btnSauverProfil">Enregistrer</button>
      <div class="message" id="messageProfil"></div>
    </form>

    <div class="section-titre">Mot de passe</div>
    <form id="formMotDePasse">
      <div class="champ">
        <label for="nouveauMdp">Nouveau mot de passe</label>
        <input type="password" id="nouveauMdp" minlength="6" required autocomplete="new-password">
      </div>
      <div class="champ">
        <label for="confirmMdp">Confirmer le mot de passe</label>
        <input type="password" id="confirmMdp" minlength="6" required autocomplete="new-password">
      </div>
      <button class="btn-principal" type="submit" id="btnSauverMdp">Changer le mot de passe</button>
      <div class="message" id="messageMdp"></div>
    </form>

    <button class="btn-secondaire" id="btnDeconnexion">Se déconnecter</button>
  </div>
</main>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="parametres.js"></script>

</body>
</html>
