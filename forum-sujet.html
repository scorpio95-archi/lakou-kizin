<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sujet — Forum Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="forum.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="forum.html">Forum</a>
  <span style="opacity:.6;">/</span>
  <span id="sujet-fil">Sujet</span>
</div>

<p id="sujet-guard-msg" class="pub-grid-empty">Chargement…</p>

<div id="sujet-content" class="hidden forum-sujet-root">

  <div class="forum-topic-detail" id="forum-topic-detail"></div>

  <div id="admin-resolve-bar" class="hidden" style="margin:14px 0;"></div>

  <div class="forum-replies-section">
    <p class="forum-section-title" id="forum-replies-count">Réponses</p>
    <div id="forum-replies-list"></div>
  </div>

  <div id="forum-reply-form" class="forum-reply-form">
    <div class="champ">
      <label>Ta réponse</label>
      <textarea id="forum-reply-content" rows="4" placeholder="Écris ta réponse…"></textarea>
    </div>
    <button class="btn-principal" id="forum-reply-submit" style="width:100%;" onclick="doPostReply()">Répondre</button>
  </div>

  <div id="forum-locked-msg" class="forum-locked-msg hidden">
    🔒 Ce sujet est marqué comme résolu — les réponses sont désormais fermées.
  </div>

</div>

<footer>Lakou Kizin — École de cuisine, réseau Lakou Inivesite</footer>

<div id="toast"></div>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="forum-sujet.js"></script>
</body>
</html>
