<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap{ max-width:420px; margin:0 auto; padding:32px 20px 60px; }
  .auth-wrap h1{ font-size:1.6rem; margin-bottom:6px; }
  .auth-wrap .sub{ color:#6b5d4e; font-size:0.92rem; margin-bottom:24px; }
  .champ{ margin-bottom:16px; }
  .champ label{ display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; color:var(--charbon); }
  .champ input{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(42,23,19,0.15);
    background:var(--creme-carte); font-size:1rem; font-family:'Karla', sans-serif; color:var(--charbon);
  }
  .champ input:focus{ outline:none; border-color:var(--bordeaux); }
  .btn-principal{
    width:100%; padding:14px; border:none; border-radius:12px; margin-top:6px;
    background:var(--bordeaux); color:#fff8ec; font-weight:700; font-size:1rem;
    font-family:'Karla', sans-serif; cursor:pointer;
  }
  .btn-principal:disabled{ opacity:0.6; }
  .lien-bas{ text-align:center; margin-top:18px; font-size:0.9rem; color:#6b5d4e; }
  .lien-bas a{ color:var(--bordeaux); font-weight:700; }
  .message{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:0.88rem; display:none; }
  .message.erreur{ background:#fbe3df; color:#8a2c1c; display:block; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="index.html">Lakou Kizin</a>
  <span style="opacity:.6;">/</span>
  <span>Connexion</span>
</div>

<main class="auth-wrap">
  <h1>Content de te revoir</h1>
  <p class="sub">Connecte-toi pour publier et interagir avec la communauté.</p>

  <form id="formConnexion">
    <div class="champ">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="champ">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button class="btn-principal" type="submit" id="btnSubmit">Se connecter</button>
    <div class="message" id="message"></div>
  </form>

  <p class="lien-bas">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
</main>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script>
  const form = document.getElementById('formConnexion');
  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Connexion…';
    msg.className = 'message';

    const { error } = await connecter({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });

    if (error) {
      msg.textContent = 'E-mail ou mot de passe incorrect.';
      msg.className = 'message erreur';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    } else {
      window.location.href = 'index.html';
    }
  });
</script>

</body>
</html>
