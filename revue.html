<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revue — Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="index.html">Lakou Kizin</a>
  <span style="opacity:.6;">/</span>
  <span>Revue</span>
</div>

<!-- BANDEAU ÉDITORIAL -->
<section class="revue-bandeau">
  <span class="revue-bandeau-kicker">Espace éditorial</span>
  <h1>La Revue</h1>
  <p>Recettes, portraits, coulisses des ateliers — le journal de la communauté Lakou Kizin.</p>
  <div class="revue-bandeau-rubriques">
    <span>Recette de la semaine</span>
    <span>Kisa ou wè ?</span>
    <span>Lekòl Kizin</span>
    <span>Articles</span>
  </div>
</section>

<div class="revue-toolbar">
  <input type="text" id="revue-search" class="revue-search" placeholder="Rechercher un titre..." oninput="onRevueSearchInput()">
  <div class="revue-categories" id="revue-categories">
    <button class="revue-cat-pill active" data-slug="" onclick="setRevueCategory('', this)">Tout</button>
  </div>
  <div id="revue-admin-bar" class="hidden" style="margin-bottom:1.2rem">
    <button class="btn-principal" onclick="window.location.href='revue-admin.html'">+ Nouvelle publication</button>
  </div>
</div>

<div class="revue-body">
  <div id="revue-grid" class="revue-grid">
    <p class="pub-grid-empty">Chargement...</p>
  </div>
  <div class="revue-load-more hidden" id="revue-load-more-wrap">
    <button class="btn-secondaire" id="revue-load-more-btn" onclick="loadRevuePosts(false)">Charger plus</button>
  </div>
</div>

<footer>Lakou Kizin — École de cuisine, réseau Lakou Inivesite</footer>

<div id="toast"></div>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="revue.js"></script>
</body>
</html>
