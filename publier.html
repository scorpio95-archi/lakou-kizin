<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier — Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .form-wrap{ max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  .form-wrap h1{ font-size:1.5rem; margin-bottom:20px; }
  .champ{ margin-bottom:18px; }
  .champ label{ display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; color:var(--charbon); }
  .champ input[type="text"], .champ select, .champ textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(42,23,19,0.15);
    background:var(--creme-carte); font-size:1rem; font-family:'Karla', sans-serif; color:var(--charbon);
  }
  .champ textarea{ min-height:90px; resize:vertical; }
  .champ input:focus, .champ select:focus, .champ textarea:focus{ outline:none; border-color:var(--bordeaux); }

  .zone-upload{
    border:2px dashed rgba(110,20,35,0.3); border-radius:14px; padding:22px 16px;
    text-align:center; cursor:pointer; background:rgba(110,20,35,0.03);
  }
  .zone-upload svg{ width:26px; height:26px; color:var(--bordeaux); margin-bottom:8px; }
  .zone-upload p{ font-size:0.88rem; color:#6b5d4e; }
  .zone-upload small{ display:block; color:#a8967f; font-size:0.76rem; margin-top:4px; }
  input[type="file"]{ display:none; }

  .previews{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .preview-item{ position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; background:#000; }
  .preview-item img, .preview-item video{ width:100%; height:100%; object-fit:cover; }
  .preview-item .retirer{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,0.6); color:#fff; border:none; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .preview-item .statut{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55); color:#fff;
    font-size:0.62rem; text-align:center; padding:2px 0;
  }

  .checkbox-creation{
    display:flex; align-items:flex-start; gap:10px; background:rgba(193,72,29,0.06);
    border:1px solid rgba(193,72,29,0.25); border-radius:12px; padding:12px 14px; margin-bottom:20px;
  }
  .checkbox-creation input{ margin-top:3px; width:18px; height:18px; accent-color:var(--paprika); }
  .checkbox-creation label{ font-size:0.88rem; color:#4a3d31; }
  .checkbox-creation strong{ display:block; color:var(--paprika-fonce); margin-bottom:2px; }

  .btn-principal{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--bordeaux); color:#fff8ec; font-weight:700; font-size:1rem;
    font-family:'Karla', sans-serif; cursor:pointer;
  }
  .btn-principal:disabled{ opacity:0.6; }
  .message{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:0.88rem; display:none; }
  .message.erreur{ background:#fbe3df; color:#8a2c1c; display:block; }
  .message.info{ background:#f0e6d8; color:#5a4d40; display:block; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="index.html">Lakou Kizin</a>
  <span style="opacity:.6;">/</span>
  <span>Publier</span>
</div>

<main class="form-wrap">
  <h1>Partager une création</h1>

  <div id="blocConnexionRequise" style="display:none;" class="connexion-requise">
    Tu dois <a href="connexion.html">te connecter</a> pour publier.
  </div>

  <form id="formPublication">
    <div class="champ">
      <label for="titre">Titre</label>
      <input type="text" id="titre" required maxlength="80" placeholder="Ex : Pain au levain, 3e essai">
    </div>

    <div class="champ">
      <label for="atelier">Atelier</label>
      <select id="atelier" required></select>
    </div>

    <div class="champ">
      <label for="description">Description</label>
      <textarea id="description" placeholder="Raconte ta technique, tes ingrédients, ta difficulté…"></textarea>
    </div>

    <div class="champ">
      <label>Photos et vidéos</label>
      <div class="zone-upload" id="zoneUpload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
        <p>Touche pour ajouter des photos ou une courte vidéo</p>
        <small>Vidéos : 60 secondes max. Compressées automatiquement si &gt; 10 Mo.</small>
      </div>
      <input type="file" id="fichierInput" accept="image/*,video/*" multiple>
      <div class="previews" id="previews"></div>
    </div>

    <div class="checkbox-creation">
      <input type="checkbox" id="estCreation">
      <label for="estCreation"><strong>Proposer en "Vos créations"</strong>Mets-la en avant sur la page d'accueil.</label>
    </div>

    <button class="btn-principal" type="submit" id="btnSubmit">Publier</button>
    <div class="message" id="message"></div>
  </form>
</main>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="publier.js"></script>

</body>
</html>
