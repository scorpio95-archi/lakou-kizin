<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Revue Lakou Kizin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="revue.html" class="logo-link">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#c1481d"/>
      <path d="M13 15v10M13 15c0 2 2 2 2 0v-3M17 15v10M17 12c-2 0-3 1.5-3 4M27 12c-4 0-6 3-6 7 0 2 1.5 3 3 3s3-1 3-3" stroke="#fbf3e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">LAKOU<span>Kizin</span></span>
  </a>
  <span id="authStatus" style="font-weight:700; font-size:0.9rem;"></span>
</header>

<div class="fil-ariane">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  <a href="revue.html">Revue</a>
  <span style="opacity:.6;">/</span>
  <span id="article-fil">Article</span>
</div>

<div class="revue-article-root">

  <div class="revue-article-header">
    <p class="pub-grid-empty" id="revue-article-loading">Chargement...</p>
    <span class="revue-article-cat hidden" id="article-cat"></span>
    <h1 class="revue-article-title hidden" id="article-title"></h1>
    <div class="revue-article-meta hidden" id="article-meta"></div>
  </div>

  <div class="revue-article-cover hidden" id="article-cover-wrap">
    <img id="article-cover-img" alt="">
  </div>

  <div class="revue-article-body">
    <div class="revue-video-wrap hidden" id="article-video-wrap">
      <video id="article-video" controls preload="metadata"></video>
    </div>

    <div class="revue-social-links hidden" id="article-social-links"></div>

    <div class="revue-prose" id="article-body"></div>

    <div class="revue-gallery hidden" id="article-gallery"></div>
  </div>

  <div class="revue-article-actions hidden" id="article-admin-actions">
    <button class="btn-secondaire" onclick="editArticle()">Modifier</button>
    <button class="btn-secondaire revue-btn-danger" onclick="deleteArticle()">Supprimer</button>
  </div>

</div>

<footer>Lakou Kizin — École de cuisine, réseau Lakou Inivesite</footer>

<div id="toast"></div>

<script src="client-supabase.js"></script>
<script src="auth.js"></script>
<script src="revue-article.js"></script>
</body>
</html>
